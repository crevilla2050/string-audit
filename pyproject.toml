[project]
name = "dennis"
version = "0.9.4"
description = "Dennis the Forge core engine - The Fort Knox DEX release"
readme = "README.md"
requires-python = ">=3.9"

dependencies = [
"lxml>=4.9",
"jsonschema>=4.0",
"segno>=1.6.0",
"qrcode[pil]>=7.4",
"pynacl>=1.5",
"pyzipper",
"cryptography",
"python-dotenv==1.0.1",
"requests",
"pathspec",
"rfc8785>=0.1.4"
]

[project.scripts]
dennis = "dennis.cli:main"
dennis-extract-html = "dennis.plugins.html:main"
dennis-extract-document = "dennis.plugins.office_documents:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dennis"]
exclude = ["src/dennis/new_feature.py"]

[tool.hatch.build.targets.wheel.force-include]
"src/dennis/schemas/plan.schema.json" = "dennis/schemas/plan.schema.json"

[tool.hatch.build.targets.sdist]
include = [
"src/dennis",
"tests",
"examples",
"README.md",
"LICENSE",
]
exclude = ["src/dennis/new_feature.py"]
