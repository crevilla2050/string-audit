[project.scripts]
dennis = "string_audit.cli:main"

[project]
name = "dennis"
version = "0.1.1"
description = "Dennis the Forge core engine"
readme = "README.md"
requires-python = ">=3.9"

dependencies = [
    "lxml>=4.9",
    "jsonschema>=4.0",
    "segno>=1.6.0",
    "qrcode[pil]>=7.4",
    "pynacl>=1.5", # for ed25519
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/string_audit"]