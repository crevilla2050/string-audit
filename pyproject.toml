[project.scripts]
dennis = "string_audit.cli:main"

[project]
name = "dennis"
version = "0.5.0"
description = "Dennis the Forge core engine"
readme = "README.md"
requires-python = ">=3.9"

dependencies = [
    "lxml>=4.9",
    "jsonschema>=4.0",
    "segno>=1.6.0",
    "qrcode[pil]>=7.4",
    "pynacl>=1.5",
    "pyzipper",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/string_audit", "src/dennis"]

include = [
    "src/dennis/schemas/*.json",
    "src/string_audit/schemas/*.json"
]

[tool.hatch.build.targets.sdist]
include = [
    "src/string_audit",
    "src/dennis",
    "tests",
    "examples",
    "README.md",
    "LICENSE",
]