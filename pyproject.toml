[project]
name = "string-audit"
version = "0.1.0"
description = "Dennis the Forge core engine"
requires-python = ">=3.9"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[project.scripts]
dennis = "string_audit.cli:main"
